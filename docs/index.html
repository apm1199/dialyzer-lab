class="controlHeading">Membrane transport</h3><label>Hydraulic permeability Lp<span>mL/(h·mmHg·m²)</span><input data-property="Lp" id="design_Lp" type="number" step="any"></label><p class="hint">If the datasheet gives total KUF, divide it by membrane area. This input uses mL, not L.</p><p id="darcyModeNotice" class="hint" hidden>Research override: intrinsic Darcy permeability is selected. Lp is not used.</p><button id="resetDesign" class="secondary">Restore HF1000 reference</button><dl class="facts"><div><dt>Aqueous feed flow Qw</dt><dd id="qw">—</dd></div><div><dt>Net ultrafiltration</dt><dd>0 mL/min · imposed</dd></div></dl><button id="export" class="primary">Export result ↗</button></aside><div class="results"><div class="resultHeading"><div><p class="eyebrow">PRISTINE MEMBRANE · STEADY CVVHD</p><h2>Filter performance</h2></div><span class="tag" id="sourceTag">HF1000-CALIBRATED</span></div><div class="metrics twoMetrics"><article class="metric mainMetric"><span>Clearance · aqueous reference Kwater</span><strong id="k">—</strong><small>mL/min · concentration in the aqueous phase</small></article><article class="metric"><span>Clearance · total-fluid reference Kbulk</span><strong id="kbulk">—</strong><small>mL/min · concentration in total feed fluid</small></article></div><div id="predictionNotice" class="notice"></div><div class="panel chartPanel"><div class="chartTitle"><h3>Clearance versus dialysate flow</h3><span class="legend"><i></i> Prediction <b id="referenceLegend">● HF1000 reference</b></span></div><div id="staticChart" class="chart"></div><p id="chartNote" class="caption"></p></div><section class="panel comparisonPanel"><p class="eyebrow">EXTERNAL CHECK · NEVER A CALIBRATION INPUT</p><h3>Compare with a manufacturer value</h3><div class="inputGrid"><label>Manufacturer clearance<span>mL/min · optional</span><input id="manufacturerK" type="number" min="0" step="any" placeholder="Enter a value to compare"></label><label>Concentration reference<select id="comparisonBasis"><option value="aqueous">Aqueous phase · compare with Kwater</option><option value="bulk">Total feed fluid · compare with Kbulk</option></select></label></div><label class="checkLine"><input id="matchedConditions" type="checkbox"> I checked matching flows, fluid, net UF and concentration reference.</label><p id="comparisonResult" class="comparisonResult">No comparison value entered.</p><p class="hint">Changing this value never changes the predicted clearance. A numerical difference is not experimental validation.</p></section><details class="panel secondaryResults"><summary>Concentration and removal outputs</summary><label>Inlet urea concentration<span>kg/m³ · total feed fluid; does not affect clearance</span><input id="cin" type="number" value="0.885" min="0.000001" step="any"></label><div class="outletGrid"><div><span>Urea removal</span><strong id="removal">—</strong></div><div><span>Feed outlet · total-fluid concentration</span><strong id="cb">—</strong></div><div><span>Dialysate outlet</span><strong id="cd">—</strong></div></div></details><section id="researchPanel" class="panel researchPanel" hidden><p class="eyebrow">RESEARCH MODE</p><h2>Advanced physical parameters</h2><p class="hint">These parameters remain in the equations in Standard mode. Switching modes changes visibility, not the model or values. Reference values are modelling assumptions; no temperature correction is applied.</p><div class="inputGrid"><label>Hydraulic input<select data-property="hydraulicMode" id="design_hydraulicMode"><option value="Lp">Lp · derive intrinsic Darcy permeability</option><option value="darcy">Intrinsic Darcy permeability</option></select></label><label>Intrinsic Darcy permeability<span>m²</span><input data-property="darcy_m2" id="design_darcy_m2" type="number" step="any"></label><label>Blood rheology<select data-property="rheology" id="design_rheology"><option value="carreau">Carreau–Yasuda</option><option value="newtonian">Constant viscosity</option></select></label><label>Membrane porosity<span>fraction</span><input data-property="porosity" id="design_porosity" type="number" step="any"></label><label>Tortuosity<input data-property="tortuosity" id="design_tortuosity" type="number" step="any"></label><label>Fibre packing fraction<span>fraction</span><input data-property="packing" id="design_packing" type="number" step="any"></label><label>Haematocrit<span>fraction</span><input data-property="hematocrit" id="design_hematocrit" type="number" step="any"></label><label>Bulk pore-fluid urea diffusivity<span>m²/s</span><input data-property="membraneDiffusivity" id="design_membraneDiffusivity" type="number" step="any"></label><label>Hindrance / partition factor<input data-property="hindrance" id="design_hindrance" type="number" step="any"></label><label>Pore-fluid viscosity<span>Pa·s</span><input data-property="muPore" id="design_muPore" type="number" step="any"></label><label>Water / dialysate viscosity<span>Pa·s</span><input data-property="muWater" id="design_muWater" type="number" step="any"></label><label>Constant blood viscosity<span>Pa·s</span><input data-property="muBlood" id="design_muBlood" type="number" step="any"></label><label>Feed-water urea diffusivity<span>m²/s</span><input data-property="waterDiffusivity" id="design_waterDiffusivity" type="number" step="any"></label><label>Blood urea diffusivity parameter<span>m²/s</span><input data-property="bloodDiffusivity" id="design_bloodDiffusivity" type="number" step="any"></label><label>Dialysate urea diffusivity<span>m²/s</span><input data-property="dialysateDiffusivity" id="design_dialysateDiffusivity" type="number" step="any"></label><label>Feed Sherwood number<input data-property="ShBlood" id="design_ShBlood" type="number" step="any"></label><label>Dialysate Sherwood number<input data-property="ShDialysate" id="design_ShDialysate" type="number" step="any"></label><label>Plasma water fraction<input data-property="plasmaWater" id="design_plasmaWater" type="number" step="any"></label><label>RBC water fraction<input data-property="rbcWater" id="design_rbcWater" type="number" step="any"></label><label>Carreau zero-shear viscosity<span>Pa·s</span><input data-property="mu0" id="design_mu0" type="number" step="any"></label><label>Carreau high-shear viscosity<span>Pa·s</span><input data-property="muInf" id="design_muInf" type="number" step="any"></label><label>Carreau time constant<span>s</span><input data-property="carreauTime" id="design_carreauTime" type="number" step="any"></label><label>Carreau n<input data-property="carreauN" id="design_carreauN" type="number" step="any"></label><label>Carreau a<input data-property="carreauA" id="design_carreauA" type="number" step="any"></label><label>Axial cells<span>20–400</span><input data-property="cells" id="design_cells" type="number" step="1"></label></div><button id="resetResearch" class="secondary">Reset advanced parameters only</button><h3 class="controlHeading">Model diagnostics</h3><dl class="facts"><div><dt>Overall equivalent K₀A</dt><dd id="koa">—</dd></div><div><dt>Derived Darcy permeability</dt><dd id="darcy">—</dd></div><div><dt>Material effective diffusivity</dt><dd id="deff">—</dd></div><div><dt>Equivalent fibres</dt><dd id="fiberCount">—</dd></div><div><dt>Gross filtration / backfiltration</dt><dd id="grossUF">—</dd></div><div><dt>Net UF</dt><dd id="netUF">—</dd></div><div><dt>Feed / dialysate pressure drop</dt><dd id="pressureDrops">—</dd></div><div><dt>Numerical mass balance residual</dt><dd id="massBalance">—</dd></div><div><dt>Design conductance ratio</dt><dd id="designRatio">—</dd></div></dl></section></div></div></section><section id="data" class="tab" hidden><div class="sectionHeading"><p class="eyebrow">RESEARCH CHECKS</p><h2>HF1000 reference reconstruction</h2><p>These are the original reference responses. Reproducing calibration nodes checks implementation; it does not establish independent predictive accuracy.</p></div><div class="panel"><h3 id="datasetName"></h3><div class="tableWrap"><table><thead><tr><th>Qd</th><th>Reference Kwater</th><th>Reconstructed Kwater</th><th>K₀A</th></tr></thead><tbody id="dataRows"></tbody></table></div><p id="lowCheck" class="hint"></p><h3>Internal leave-one-out check</h3><p id="cv" class="hint"></p><div class="tableWrap"><table><thead><tr><th>Excluded Qd</th><th>Reference K</th><th>Prediction</th><th>Difference</th></tr></thead><tbody id="cvRows"></tbody></table></div></div></section><section id="method" class="tab" hidden><div class="sectionHeading"><p class="eyebrow">MODEL &amp; METHOD</p><h2>Understand the prediction.</h2></div><div class="methodTabs" role="group" aria-label="Method topics"><button data-method="methodOverview" class="active" aria-pressed="true">Overview</button><button data-method="methodEquations" aria-pressed="false">Equations</button><button data-method="methodValidation" aria-pressed="false">Validation</button><button data-method="methodScope" aria-pressed="false">Scope &amp; assumptions</button></div><div id="methodOverview" class="methodPage panel prose"><h3>Purpose and operating scope</h3><p>Dialyzer Lab predicts steady urea clearance for pristine hollow-fibre membranes in CVVHD at zero net ultrafiltration. The reference is the Baxter Prismaflex HF1000 response; experimental activities were conducted in collaboration with Hematica. The reduced software model and its extrapolation have their own verification requirements.</p><h3>Standard and Research modes</h3><p>Standard mode exposes Qb, Qd, area, fibre length, inner diameter, membrane thickness and Lp, plus fluid selection. Research mode exposes material, film-transfer, rheological and numerical assumptions. Both modes run the same equations. Unknown membrane parameters remain declared assumptions, not measured properties.</p><h3>Prediction and comparison remain separate</h3><p>Other-filter clearances are external comparison targets only. The software does not fit its parameters to the optional manufacturer clearance. Reference reconstruction and manufacturer cross-checks are shown separately in the Validation topic.</p></div><div id="methodEquations" class="methodPage panel prose" hidden><h3>Geometry and material transport</h3><div class="inlineEq">ro = ri + δ; ℓc = ri ln(ro/ri); Nf = A/(2πri L)<br>rd = ro / √φ<br>Deff,m = Dm εm h / τ<br>kDarcy = Lp μpore δ</div><p>Membrane porosity εm and fibre packing φ are different properties. Lp must first be converted to SI units. With fixed Lp, pore viscosity cancels from the cylindrical hydraulic conductance; with intrinsic Darcy input it remains active.</p><h3>Coupled transport</h3><div class="inlineEq">Jv = kDarcy (pb − pd)/(μpore ℓc)<br>Rm = ℓc/Deff,m + Radd(Qd)<br>P = [1/kb + Rm + 1/kd]⁻¹<br>kfilm = Sh D/dh<br>Js = P[B(−Pe) Cb − B(Pe) Cd]<br>Pe = Jv/P; B(z) = z/[exp(z) − 1]</div><p>A conservative finite-volume solver couples hydraulics and solute transport in 100 axial cells by default. Net UF is constrained to zero while local filtration and backfiltration may occur. Film Sherwood numbers are constant closure parameters, not flow-dependent correlations.</p><h3>HF1000 reduction and transfer</h3><div class="inlineEq">K₀A,ref = η Aref Dapp,ref / ℓc,ref<br>K₀A,design = K₀A,ref × K₀A,1D,design / K₀A,1D,ref</div><p>Dapp and η represent the calibrated HF1000 reduction. Above Qd = 133.33 mL/min, unresolved resistance decays exponentially with matched endpoint value and slope; η remains at its terminal value. This is a declared continuation assumption.</p><h3>Countercurrent exchanger</h3><div class="inlineEq">Qmin = min(Qw,Qd); Cr = Qmin/Qmax; NTU = K₀A/Qmin<br>Kwater = Qmin [1 − exp(−NTU(1 − Cr))] / [1 − Cr exp(−NTU(1 − Cr))]<br>For Qw = Qd = Q: Kwater = Q K₀A/(Q + K₀A)</div><h3>Concentration reference</h3><div class="inlineEq">fw = (1 − Hct)fw,p + Hct fw,e; Qw = fw Qb<br>Cw,in = Cbulk,in/fw; ṁ = Kwater Cw,in<br>Cbulk,out = Cbulk,in (1 − Kwater/Qw)<br>Cd,out = Kwater Cw,in/Qd; Kbulk = Kwater/fw</div><p>Concentration scales removal and outlet concentrations, not clearance. At Qd = 0, clearance and removal are zero and effluent concentration is undefined.</p></div><div id="methodValidation" class="methodPage panel" hidden><p class="eyebrow">CURVES AND COMPARISON POINTS</p><h3>Predictions across filter configurations</h3><p class="hint">Compare the computed curve with published manufacturer points. No manufacturer clearance or K₀A enters the transport model. These are numerical datasheet cross-checks, not new experimental measurements.</p><label>Filter configuration<select id="validationFilter"><option value="hfWater">HF1000 · water calibration</option><option value="hfBlood">HF1000 · blood numerical calibration</option><option value="hi18">xevonta Hi 18</option><option value="hi20" selected>xevonta Hi 20</option><option value="hi23">xevonta Hi 23</option></select></label><div class="validationMeta"><span class="tag" id="validationBadge">OUTSIDE HF1000 CALIBRATION</span><p id="validationConditions"></p><p id="validationAssumptions" class="hint"></p></div><div class="chartTitle"><h3 id="validationChartHeading">Clearance versus feed flow</h3><span class="legend"><i></i> Prediction <b>●</b><span id="validationPointLabel"> Manufacturer</span></span></div><div id="validationChart" class="chart"></div><div class="tableWrap"><table><thead><tr><th>Qb</th><th>Qd</th><th>Predicted Kwater</th><th>Reference / manufacturer K</th><th>Difference %</th></tr></thead><tbody id="validationRows"></tbody></table></div><p id="validationSummary"></p><div id="externalValidationNotes"><p class="hint">The calculation uses water, so Kwater = Kbulk. Manufacturer concentration basis and test fluid must be checked before interpreting the difference as a validation error. Missing physical properties use HF1000 defaults. The continuation was selected after xevonta comparisons were already available; this is not a blind validation set.</p><p class="hint">Source: B. Braun xevonta / Renal Therapies Dialyzer technical brochures, urea clearance at Qd = 500 mL/min and QF = 0. <a href="https://www.bbraunusa.com/en/products/b4/xevonta-dialyzer.html" target="_blank" rel="noopener noreferrer">Manufacturer product and documents ↗</a></p></div><h3>Inside the reference conditions</h3><p class="hint">The HF1000 reference is at Qb = 100 mL/min and Qd ≤ 133.33 mL/min. Its calibration points are reconstructed by definition. Blood response points begin at Qd = 41.67 mL/min. Numerical implementation checks are not independent experimental validation.</p></div><div id="methodScope" class="methodPage panel prose" hidden><h3>Included</h3><p>Urea, pristine hollow-fibre membranes, steady countercurrent operation, zero net UF, water or an approximate blood-water transport description. Local convection and backfiltration are included in the 1D design model.</p><h3>Declared assumptions</h3><p>No adsorption, fouling, oncotic pressure or protein binding is modelled. Urea hindrance defaults to one as a modelling assumption. The water and blood properties retain the implemented reference values; the software does not apply a temperature correction. Haematocrit changes aqueous fraction and solute transport; it does not independently refit the Carreau parameters.</p><h3>How to interpret a comparison</h3><p>Match Qb, Qd, fluid, net UF, concentration basis and test conditions. Record assumed geometry and membrane properties. Agreement within one product family does not establish accuracy for all membranes. New comparisons should keep the HF1000 calibration fixed.</p><h3>Access</h3><p>The entry password is checked in the browser. It controls normal interface navigation; it does not make the GitHub source or static assets private.</p></div></section><section class="contactSection" aria-labelledby="contacts-title"><div><p class="eyebrow">CONTACTS</p><h2 id="contacts-title">Let’s talk transport.</h2></div><div class="contactCards"><article><span class="footerLabel">MODEL DEVELOPMENT</span><h3>Antonio Pio Mantovan</h3><p>PhD researcher · Politecnico di Torino<br>DISAT · Department of Applied Science and Technology</p><p>Corso Duca degli Abruzzi 24<br>10129 Torino, Italy<br><small>Campus entrance: Corso Castelfidardo 39</small></p><a href="mailto:antonio.mantovan@polito.it">antonio.mantovan@polito.it ↗</a></article><article><span class="footerLabel">EXPERIMENTAL COLLABORATION</span><h3>Hematica</h3><a href="mailto:info@hematica.it">info@hematica.it ↗</a><a href="https://www.hematica.it/" target="_blank" rel="noopener noreferrer">hematica.it ↗</a><p>Corso Castelfidardo 30/A<br>10129 Turin, Italy</p></article></div></section><footer><div class="authorCredit"><span class="footerLabel">DIALYZER LAB</span><span>Developed by <strong>Antonio Pio Mantovan</strong></span><small>Research models · local browser processing</small></div><div class="validationCredit"><span>Experimental validation activities<br>in collaboration with <strong>Hematica</strong></span><a href="https://www.hematica.it/" target="_blank" rel="noopener noreferrer" aria-label="Hematica"><span class="hematicaWordmark"><img src="assets/hematica-white.png" alt="Hematica" width="768" height="263"></span></a></div></footer></main></template></body></html>
