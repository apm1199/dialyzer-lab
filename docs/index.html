1D transport model. Feed and dialysate flows have no preset upper cutoff; predictions outside the reference conditions are exploratory.</p><label class="designToggle"><input id="designEnabled" type="checkbox"> Enable membrane design prediction</label><div class="inputGrid"><label>Membrane inner area · m²<input data-property="area_m2" id="design_area_m2" type="number" step="any"></label><label>Fibre length · mm<input data-property="length_mm" id="design_length_mm" type="number" step="any"></label><label>Fibre inner diameter · μm<input data-property="diameter_um" id="design_diameter_um" type="number" step="any"></label><label>Membrane thickness · μm<input data-property="thickness_um" id="design_thickness_um" type="number" step="any"></label><label>Fibre packing fraction<input data-property="packing" id="design_packing" type="number" step="any"></label><label>Membrane porosity<input data-property="porosity" id="design_porosity" type="number" step="any"></label><label>Tortuosity<input data-property="tortuosity" id="design_tortuosity" type="number" step="any"></label><label>Bulk membrane-fluid diffusivity · m²/s<input data-property="membraneDiffusivity" id="design_membraneDiffusivity" type="number" step="any"></label><label>Hindrance / partition factor<input data-property="hindrance" id="design_hindrance" type="number" step="any"></label><label>Hydraulic permeability Lp · mL/(h·mmHg·m²)<input data-property="Lp" id="design_Lp" type="number" step="any"></label><label>Intrinsic Darcy permeability · m²<input data-property="darcy_m2" id="design_darcy_m2" type="number" step="any"></label><label>Pore-fluid viscosity · Pa·s<input data-property="muPore" id="design_muPore" type="number" step="any"></label><label>Total feed flow · mL/min<input data-property="feedFlow_mLmin" id="design_feedFlow_mLmin" type="number" step="any"></label><label>Water / dialysate viscosity · Pa·s<input data-property="muWater" id="design_muWater" type="number" step="any"></label><label>Constant blood viscosity · Pa·s<input data-property="muBlood" id="design_muBlood" type="number" step="any"></label><label>Haematocrit<input data-property="hematocrit" id="design_hematocrit" type="number" step="any"></label><label>Feed-water diffusivity · m²/s<input data-property="waterDiffusivity" id="design_waterDiffusivity" type="number" step="any"></label><label>Blood solute diffusivity · m²/s<input data-property="bloodDiffusivity" id="design_bloodDiffusivity" type="number" step="any"></label><label>Dialysate diffusivity · m²/s<input data-property="dialysateDiffusivity" id="design_dialysateDiffusivity" type="number" step="any"></label><label>Feed Sherwood number<input data-property="ShBlood" id="design_ShBlood" type="number" step="any"></label><label>Dialysate Sherwood number<input data-property="ShDialysate" id="design_ShDialysate" type="number" step="any"></label><label>Hydraulic input<select data-property="hydraulicMode" id="design_hydraulicMode"><option value="Lp">Use Lp · derive Darcy permeability</option><option value="darcy">Use intrinsic Darcy permeability</option></select></label><label>Blood rheology<select data-property="rheology" id="design_rheology"><option value="carreau">Carreau–Yasuda</option><option value="newtonian">Constant viscosity</option></select></label></div><button id="resetDesign" class="secondary">Restore HF1000 reference properties</button><dl class="facts"><div><dt>Darcy permeability</dt><dd id="darcy">—</dd></div><div><dt>Material effective diffusivity</dt><dd id="deff">—</dd></div><div><dt>Equivalent number of fibres</dt><dd id="fiberCount">—</dd></div><div><dt>Gross filtration / backfiltration</dt><dd id="grossUF">—</dd></div><div><dt>Net ultrafiltration</dt><dd id="netUF">—</dd></div><div><dt>Feed / dialysate pressure drop</dt><dd id="pressureDrops">—</dd></div></dl><p class="hint">Area, length and diameter determine the equivalent fibre count. Only the selected hydraulic input is used. Carreau–Yasuda constants and plasma/RBC water fractions retain the documented reference values. Imported datasets use their own interpolation; design transfer is available for the built-in presets.</p></section></div></div></section>
<section id="data" class="tab" hidden><div class="sectionHeading"><p class="eyebrow">STEADY IDENTIFICATION &amp; CHECKS</p><h2>Bring your measurements.</h2><p>Import steady clearances at different dialysate flows while keeping the filter, fluid, Qb and net UF unchanged. Aggregate replicates before importing.</p></div><div class="twoCols"><div class="panel"><h3>Import a CSV dataset</h3><label>Fluid<select id="importFluid"><option value="water">Water</option><option value="blood">Blood · aqueous concentration reference</option></select></label><label>Dataset Qb <span>mL/min</span><input id="importQb" type="number" value="100" min="0.001"></label><label>Blood water fraction <span>0 &lt; fw ≤ 1</span><input id="importFw" type="number" value="0.8565" min="0.001" max="1" step="0.0001"></label><label>Dataset name / source<input id="importName" value="My experimental measurements" maxlength="200"></label><label>CSV file<input id="steadyFile" type="file" accept=".csv,text/csv"></label><p class="hint">Required: <code>qd_mlmin,clearance_water_mlmin</code>. Optional: <code>qb_mlmin,uf_net_mlmin</code>. Clearance must use the aqueous concentration reference. Processing stays in your browser.</p><p class="hint">Imported datasets use direct K₀A interpolation within their own positive-flow range. The built-in transport correlation applies to the Baxter Prismaflex HF1000 presets.</p><button id="template" class="secondary">Download blank CSV template</button><button id="restore" class="secondary">Restore default presets</button></div><div class="panel"><p class="eyebrow">DATASET RECONSTRUCTION</p><h3 id="datasetName">—</h3><div class="tableWrap"><table><thead><tr><th>Qd</th><th>Dataset K</th><th>Model K</th><th>K₀A</th></tr></thead><tbody id="dataRows"></tbody></table></div><p class="hint">Matching fitted dataset nodes checks implementation, not independent predictive accuracy.</p><div id="lowCheck" class="notice"></div><h3>Leave-one-out check</h3><p id="cv"></p><div class="tableWrap"><table><thead><tr><th>Excluded Qd</th><th>Dataset K</th><th>Predicted K</th><th>Error</th></tr></thead><tbody id="cvRows"></tbody></table></div><p class="hint">Interior dataset points are omitted in turn. For default presets, the diffusivity correlation is retained and only the equivalent-factor mapping is refitted. This is an internal consistency check.</p><h3>Transport correlation</h3><div class="tableWrap"><table><thead><tr><th>Qd · mL/min</th><th>Dapp · m²/s</th><th>Role</th></tr></thead><tbody id="correlationRows"></tbody></table></div></div></div></section>
<section id="method" class="tab" hidden><div class="sectionHeading"><p class="eyebrow">MODEL EQUATIONS &amp; SCOPE</p><h2>A small model.<br>A precise interpretation.</h2></div><div class="twoCols"><div class="panel prose"><h3>01 / Filter configuration</h3><p>The default transport datasets describe a Baxter Prismaflex HF1000 filter in CVVHD at a feed flow of 100 mL/min and zero net ultrafiltration. Nominal filter specifications: 1.1 m² membrane area, 218 mm fibre length, 215 μm inner diameter and 50 μm membrane thickness.</p><p>Experimental validation activities were conducted in collaboration with Hematica. Numerical checks of the reduced model remain distinct from experimental validation.</p><h3>02 / Effective membrane transport</h3><p>The scope is urea transport through pristine hollow-fibre membranes in CVVHD at zero net UF. No adsorption or fouling is modelled. The geometry remains a bundle of cylindrical fibres.</p><p>The effective diffusivity Dapp(Qd) is represented by a shape-preserving cubic Hermite correlation over 0–133.33 mL/min. Its nodes are 0, 17.5, 41.67, 66.67 and 133.33 mL/min; the final derivative equals the last secant slope.</p><p>For Qd above 133.33 mL/min, the unresolved reference resistance follows Radd(Qd) = Radd(133.33) exp[−(Qd−133.33)/Qscale]. Qscale = −Radd/Radd′ at the endpoint, matching its value and slope. Thus Dapp approaches the reference material diffusivity and the equivalent reference factor stays constant. Hydraulic and solute balances use the actual entered flows. This asymptotic continuation is an extrapolation assumption, not a new calibration or a validated high-flow correlation. The chart marks the original upper boundary with a dashed line. The numeric flow input has no preset upper limit; the slider is a convenience control. Nonphysical or nonconvergent cases are rejected.<br><br>The zero node is a modelling constraint, not an experimental measurement. Water and blood use the same effective membrane correlation. Fluid-specific transport is represented through the overall equivalent factor.</p><h3>03 / Reduction to a rapid exchanger</h3><p>The cylindrical length is ℓc = ri ln(ro/ri), and the inner area is A = 2πri L N. The nominal membrane conductance is A Dapp / ℓc. An equivalent factor η maps this conductance to the overall apparent K₀A.</p><div class="inlineEq">K₀A(Qd) = η(Qd) A Dapp(Qd) / ℓc</div><p>At each calibration condition, η is identified by inverting the countercurrent clearance relation. Its values are interpolated with PCHIP. Below the first positive calibration point, η is held constant: below 17.5 mL/min for water and 41.67 mL/min for blood.</p><p>η represents the combined unresolved fluid-side and internal-convection response. It may exceed one and is not a membrane diffusivity or a physical film coefficient. This additional reduction has its own numerical checks; it does not inherit CFD validation automatically.</p><h3>04 / From K₀A to clearance</h3><p>Define Qmin = min(Qw,Qd), Qmax = max(Qw,Qd), Cr = Qmin/Qmax and NTU = K₀A/Qmin. The countercurrent exchanger effectiveness is:</p><div class="inlineEq">ε = [1 − exp(−NTU(1 − Cr))] / [1 − Cr exp(−NTU(1 − Cr))]<br>Kwater = Qmin ε</div><p>For Qw = Qd = Q, Kwater = Q K₀A/(Q + K₀A). At Qd = 0, clearance and removal are zero and there is no dialysate effluent concentration. This is a steady zero-net-UF limit; it is not an HF simulation.</p><h3>05 / Blood and concentration balances</h3><p>Qw = fw Qb, with fw = (1 − Hct)fw,p + Hct fw,e = 0.8565 for the default blood preset. Cw,in = Cbulk,in/fw. For solute-free dialysate and zero net UF:</p><div class="inlineEq">ṁ = Kwater Cw,in<br>Cw,out = Cw,in(1 − Kwater/Qw)<br>Cd,out = Kwater Cw,in/Qd<br>Kbulk = Kwater/fw</div><p>The blood preset combines Carreau–Yasuda rheology and an aqueous-phase transport description in its calibration dataset. The reference curve does not solve local flow. The design explorer adds approximate 1D hydraulics and local Jv. Predictions below 41.67 mL/min are not validated blood results.</p><h3>06 / Data and applicability</h3><p>Model parameters and datasets are informed by literature and numerical studies. Default datasets apply to the Baxter Prismaflex HF1000 configuration and stated operating conditions; user-imported datasets retain their declared origin.</p><p>The default blood dataset consists of numerical predictions, not experimental blood measurements. The reference presets retain their fixed configuration. Enable the membrane design explorer for approximate geometric, material, rheological and feed-flow sensitivity; net UF remains zero.</p></div><div class="panel prose"><h3>Design model · implementation</h3><p>The design explorer solves a steady one-dimensional hydraulic and solute balance in 100 axial cells. Blood flow is constrained to have the same inlet and outlet value: local filtration and backfiltration balance exactly.</p><div class="inlineEq">kDarcy = Lp μpore δ<br>Deff = Dbulk ε h / τ<br>Rm = ℓc / Deff + Radditional(Qd)</div><p>No clearance from another dialyzer is used to calculate a design prediction. Only physical properties enter the transfer model; other-filter clearances can be used exclusively as external checks. Missing physical properties remain assumptions. The additional resistance is retained from the HF1000 calibration: Radditional = ℓc,ref(1/Dapp,ref − 1/Deff,ref). Film resistances use kfilm = Sh D / dh, with an adjustable default Sherwood number of 3.66 on both sides. Packing determines an equivalent annular dialysate channel.</p><p>Poiseuille pressure losses and cylindrical Darcy flux are coupled along the fibre. Blood viscosity uses either a constant value or a Carreau–Yasuda approximation evaluated at nominal wall shear rate. This is an approximate 1D flow model.</p><div class="inlineEq">P = 1 / (1/kb + Rm + 1/kd)<br>Pe = Jv/P; B(z) = z/(exp(z) − 1)<br>Js = P[B(−Pe) Cb − B(Pe) Cd]</div><p>Conservative finite-volume balances include axial advection, molecular diffusion and transmembrane convection–diffusion. Urea is freely sieved; adsorption, fouling and oncotic pressure are omitted.</p><div class="inlineEq">K₀A,design = K₀A,reference × (K₀A,1D,design / K₀A,1D,reference)</div><p>The raw 1D clearances are inverted through the exchanger relation to form this ratio. It preserves the HF1000 curve at the reference properties by construction. Changing properties is a model-based transfer assumption, not independent experimental validation of another membrane. Raw 1D profiles are diagnostics; displayed outlet concentrations come from the final calibrated clearance.</p></div></div></div></section>
