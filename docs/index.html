<p class="hint">Same solver and controls. This calibration transfers the Phylther HF 17SD resistance fit from water–water CFD at Qd = 500 mL/min. It uses PCHIP in Qb and a smooth asymptotic Qd fit informed by HF1000 low-flow clearance. It passes through the Phylther CFD anchor at Qd = 500 mL/min and approaches zero additional resistance exponentially. UF is interpolated between 0 and 10 mL/min. Above UF 10, resistance is held at the UF 10 branch while the entered UF remains active in the flow and convection balances.</p></div></section>

<section id="steady" class="tab"><div class="modeBar"><div><p class="eyebrow">UREA CLEARANCE WORKBENCH</p><p id="modeHint">Set water or blood inlet flow, dialysate flow, geometry and hydraulic permeability. Research mode exposes detailed material, fluid and numerical properties.</p></div><div class="modeButtons" role="group" aria-label="Interface mode"><button id="standardMode" aria-pressed="true" class="active">Standard mode</button><button id="researchMode" aria-pressed="false">Research mode</button></div></div><p id="overrideNotice" class="hint" hidden></p><div class="workspace"><aside class="panel controls"><p class="eyebrow">OPERATING CONDITIONS</p><h2>Configure the case</h2><p class="filterStatusLegend hint"><span class="auditPartial">🟠 Some points outside ±10%</span> · <span class="auditOutside">🔴 All points outside ±10%</span> · ⚪ Not calculable or water hydraulic input required. Unmarked labels distinguish tested agreement from missing comparable data. Colours refer to the catalog preset audit in water at zero net UF, with its stated assumptions; they do not establish clinical compatibility or assess modified Research inputs.</p><p class="hint">All blood-dialyzer presets can be explored under the same CVVHD calculation conditions: urea, pristine membrane and zero net UF. Catalog application groups do not restrict the calculation. Manufacturer comparison uses individual points explicitly reported at net UF = 0, treated as water under the project convention. Geometry assumptions remain visible.</p><label>Filter preset<select id="filterPreset"></select></label><p id="presetNotes" class="hint"></p><details><summary>Reported fibre counts and sources</summary><p class="hint">Published counts, manufacturer datasheets and area-based estimates are distinct. One model count is not extended to its family.</p><div class="tableWrap"><table><thead><tr><th>Model</th><th>Fibres</th><th>Source / status</th></tr></thead><tbody id="reportedCountRows"></tbody></table></div></details><label>Feed fluid<select id="fluid"><option value="water">Water</option><option value="blood">Blood</option></select></label><label><span id="feedFlowLabel">Water inlet flow Qb</span><span>mL/min · total fluid</span><input data-property="feedFlow_mLmin" id="design_feedFlow_mLmin" type="number" step="any"></label><label>Dialysate flow Qd<span>mL/min</span><input type="number" id="qd" min="0" value="66.67" step="any"></label><input aria-label="Dialysate flow rate" type="range" id="qdRange" min="0" max="1000" value="66.67" step="0.01"><div class="rangeLabels"><span id="minQ">0</span><span id="maxQ">1000</span></div><div class="quickFlows"><button data-flow="66.67">66.67</button><button data-flow="133.33">133.33</button><button data-flow="500">500</button><button data-flow="800">800</button></div><h3 class="controlHeading">Membrane geometry</h3><div class="inputGrid standardGeometry"><label>Membrane inner area<span>m²</span><input data-property="area_m2" id="design_area_m2" type="number" step="any"></label><label>Active fibre length<span>mm</span><input data-property="length_mm" placeholder="Enter active fibre length" id="design_length_mm" type="number" step="any"></label><label>Inner diameter<span>μm</span><input data-property="diameter_um" id="design_diameter_um" type="number" step="any"></label><label>Membrane thickness<span>μm</span><input data-property="thickness_um" id="design_thickness_um" type="number" step="any"></label><label>Number of fibres used by the model<input data-property="fiberCount" id="design_fiberCount" type="number" min="1" step="1"><span id="fiberCountOrigin"></span></label></div><label class="checkLine"><input id="useFiberCount" type="checkbox"> Enter a measured or specified fibre count</label><p id="fiberCountSummary" class="hint"></p><p class="hint">Design calculations assume a fixed module internal diameter of 40 mm unless a preset reports another value. The equivalent dialysate radius and packing are calculated from the fibre count. Edit the diameter in Research mode; enter 0 to prescribe packing instead. The original calibration geometry is retained internally.</p><p class="hint">With a specified fibre count, area is calculated as Nf × π × inner diameter × fibre length. Untick the count option to enter membrane area instead.</p><details class="geometryEvidence"><summary>Geometry values and assumptions</summary><div id="geometryEvidence"></div></details><p id="geometryWarning" class="notice"></p><h3 class="controlHeading">Membrane transport</h3><label>Equivalent hydraulic permeance Lp<span>mL/(h·mmHg·m²)</span><input data-property="Lp" id="design_Lp" type="number" step="any"></label><p class="hint">Enter membrane permeance measured with water, with its reference area and temperature. Enter the value in mL/(h·mmHg·m²).</p><details><summary>Hydraulic input, source and units</summary><p id="hydraulicEvidence" class="hint"></p></details><p id="darcyModeNotice" class="hint" hidden>Preset or Research input: equivalent Darcy permeability is selected. The Lp field is inactive.</p><button id="resetDesign" class="secondary">Restore reference settings</button><dl class="facts"><div><dt>Aqueous feed flow Qw</dt><dd id="qw">—</dd></div><div><dt>Net ultrafiltration</dt><dd>0 mL/min · imposed</dd></div></dl><button id="export" class="primary">Export result ↗</button></aside><div class="results"><div class="resultHeading"><div><p class="eyebrow">PRISTINE MEMBRANE · STEADY CVVHD</p><h2>Filter performance</h2></div><span class="tag" id="sourceTag">HEMATICA · IN-VITRO CVVHD</span></div><div class="metrics twoMetrics"><article class="metric mainMetric"><span>Clearance · aqueous reference Kwater</span><strong id="k">—</strong><small>mL/min · concentration in the aqueous phase</small></article><article class="metric"><span>Filtration fraction · gross filtration / inlet flow</span><strong id="ff">—</strong><small>% · total blood or water inlet flow; net UF remains zero</small></article></div><div id="predictionNotice" class="notice"></div><details class="panel transportMetrics"><summary>Advanced transport metrics · urea</summary><div class="inputGrid"><label>Apparent membrane diffusivity Dapp<span>m²/s</span><input id="transportDapp" type="text" readonly></label><label>Additional solute resistance Radd<span>s/m</span><input id="transportRadd" type="text" readonly></label></div><p class="hint">Select a value to copy it in SI units. Dapp is the effective diffusivity for the selected membrane before global clearance normalisation. Radd is the added urea transport resistance referred to the inner fibre area. At zero dialysate flow, Dapp tends to zero and Radd diverges.</p><dl class="facts"><div><dt>Gross forward filtration</dt><dd id="transportGross">—</dd></div><div><dt>Backfiltration</dt><dd id="transportBack">—</dd></div><div><dt>Net ultrafiltration</dt><dd id="transportNet">—</dd></div><div><dt>Equivalent K₀A</dt><dd id="transportKoa">—</dd></div><div><dt>Model hydraulic K<sub>UF</sub> = L<sub>p,cyl</sub> × A<sub>inner</sub></dt><dd id="transportKuf">—</dd><small>Calculated module conductance from the entered hydraulic properties.</small></div><div><dt>Global mass-transfer NTU = K₀A / Qmin</dt><dd id="transportNtu">—</dd></div><div><dt>Effectiveness ε = Kwater / Qmin</dt><dd id="transportEffectiveness">—</dd></div><div><dt>Extraction ratio E = Kwater / Qw</dt><dd id="transportExtraction">—</dd></div><div><dt>Capacity ratio r = Qmin / Qmax</dt><dd id="transportRatio">—</dd></div><div><dt>Signed local barrier Péclet · minimum / maximum</dt><dd id="transportPe">—</dd></div></dl><p class="hint">Qmin = min(Qw, Qd); Qw is the inlet water-carrier flow. NTU, ε, E and r are dimensionless. NTU and ε describe the final equivalent counter-current exchanger. The convective urea sieving factor is assumed to be 1; it is not predicted or fitted here. These metrics do not extend the model to other solutes.</p><h3>Local barrier Péclet profile</h3><div id="transportPeChart" class="chart" aria-label="Signed local barrier Péclet profile"></div><p class="hint">Pe(x) = Jv(x) / P(x). P includes the film and membrane resistances of the local 1D solve. Positive values indicate forward filtration; negative values indicate backfiltration. This is a local diagnostic before global reference normalisation.</p><h3>Compare a manufacturer K₀A</h3><p class="hint">Optional, independent reference. Enter the reported urea K₀A and its test conditions. No comparison value enters the prediction; K₀A is an overall device coefficient, not intrinsic membrane permeability.</p><div class="inputGrid"><label>Manufacturer K₀A<span>mL/min · optional</span><input id="manufacturerKoa" type="number" min="0" step="any"></label><label>Test inlet flow Qb<span>mL/min</span><input id="manufacturerKoaQb" type="number" min="0" step="any" value="100"></label><label>Test dialysate flow Qd<span>mL/min</span><input id="manufacturerKoaQd" type="number" min="0" step="any" value="66.67"></label><label>Test UF flow<span>mL/min</span><input id="manufacturerKoaQf" type="number" step="any" value="0"></label><label>Documented test fluid<select id="manufacturerKoaMedium"><option value="unknown">Not confirmed</option><option value="water">Water / aqueous solution</option><option value="blood">Blood</option></select></label></div><p id="manufacturerKoaResult" class="hint">Enter a manufacturer K₀A to compare matched test conditions.</p></details><div class="panel chartPanel"><div class="chartTitle"><h3 id="responseHeading">Clearance versus dialysate flow</h3><label class="chartMetric">Output<select id="chartMetric"><option value="clearance">Clearance</option><option value="filtration">Filtration fraction</option></select></label><span class="legend"><i></i> Prediction <b id="referenceLegend">● Hematica reference</b></span></div><p id="comparisonChartLegend" class="caption" hidden></p><div class="figureActions" role="group" aria-label="Download prediction figure"><button id="downloadPredictionPng" class="secondary">Download figure · PNG</button><a id="downloadPredictionSvg" class="secondary figureDownload" href="#" role="button">Download figure · SVG</a></div><div id="staticChart" class="chart"></div><p id="chartNote" class="caption"></p></div><section class="panel comparisonPanel"><p class="eyebrow">MODEL-TO-MODEL · SHARED OPERATING CONDITIONS</p><h3>Compare two filters</h3><p>The white curve uses the current filter and its edited properties. Add a second filter to compare predictions under CVVHD with zero net UF at the same flows and fluid conditions.</p><label class="checkLine"><input id="compareEnabled" type="checkbox"> Show a second filter on the graph above</label><label>Second filter<select id="comparisonFilter"></select></label><div class="comparisonLegend"><span>━ Filter A · current design</span><span class="curveB">━ Filter B · selected preset</span></div><p id="comparisonResult" class="comparisonResult"></p><p id="comparisonDetails" class="hint"></p><p class="hint">Predictions use physical properties, not manufacturer clearance targets. Unknown membrane properties remain assumptions.</p></section><details class="panel secondaryResults"><summary>Concentration and removal outputs</summary><label>Inlet urea concentration<span>kg/m³ · total feed fluid; does not affect clearance</span><input id="cin" type="number" value="0.885" min="0.000001" step="any"></label><div class="outletGrid"><div><span>Clearance · total-fluid reference Kbulk</span><strong id="kbulk">—</strong></div><div><span>Urea removal</span><strong id="removal">—</strong></div><div><span>Feed outlet · total-fluid concentration</span><strong id="cb">—</strong></div><div><span>Dialysate outlet</span><strong id="cd">—</strong></div></div></details><section id="researchPanel" class="panel researchPanel" hidden><p class="eyebrow">RESEARCH MODE</p><h2>Advanced physical parameters</h2><h3>Membrane material &amp; module properties</h3><p class="hint">Enter measured or design values. Unknown properties retain the model reference assumptions. Lp and intrinsic Darcy permeability are alternative hydraulic inputs.</p><div class="inputGrid"><label>Hydraulic input<select data-property="hydraulicMode" id="design_hydraulicMode"><option value="Lp">Lp · derive intrinsic Darcy permeability</option><option value="darcy">Intrinsic Darcy permeability</option></select></label><label>Hydraulic permeance definition<select data-property="hydraulicBasis" id="design_hydraulicBasis"><option value="inner-area">Measured water Lp per inner area · cylindrical membrane</option><option value="planar">Planar membrane Lp · reference convention</option></select></label><label>Intrinsic Darcy permeability<span>m²</span><input data-property="darcy_m2" id="design_darcy_m2" type="number" step="any"></label><label>Membrane porosity<span>fraction</span><input data-property="porosity" id="design_porosity" type="number" step="any"></label><label>Tortuosity<input data-property="tortuosity" id="design_tortuosity" type="number" step="any"></label><label>Module internal diameter<span>mm · default 40 assumed; 0 = derive from packing</span><input data-property="shellDiameter_mm" id="design_shellDiameter_mm" type="number" min="0" step="any"></label><label>Total module length · upper bound only<span>mm · includes headers; 0 = unknown</span><input data-property="totalLength_mm" id="design_totalLength_mm" type="number" min="0" step="any"></label><label>Fibre packing fraction<span>fraction</span><input data-property="packing" id="design_packing" type="number" step="any"></label><label>Bulk pore-fluid urea diffusivity<span>m²/s</span><input data-property="membraneDiffusivity" id="design_membraneDiffusivity" type="number" step="any"></label><label>Hindrance / partition factor<input data-property="hindrance" id="design_hindrance" type="number" step="any"></label><label>Pore-fluid viscosity<span>Pa·s</span><input data-property="muPore" id="design_muPore" type="number" step="any"></label></div><p class="hint">Porosity, tortuosity, pore-fluid diffusivity and hindrance control effective urea diffusivity. Packing describes the fibre bundle. Pore size is not an independent input in this effective-medium formulation; its hydraulic and diffusive effects must be represented by permeability and transport properties.</p><h3>Fluid-side mass transfer</h3><div class="inputGrid"><label>Feed Sherwood number<input data-property="ShBlood" id="design_ShBlood" type="number" step="any"></label><label>Dialysate Sherwood number<input data-property="ShDialysate" id="design_ShDialysate" type="number" step="any"></label></div><p class="hint">Constant feed-side Sherwood: 4.36. Constant dialysate-side Sherwood: 3.66. Values can be edited here. Sherwood describes fluid-side transfer, separately from membrane material properties.</p><h3>Fluid properties &amp; numerical settings</h3><p class="hint">These parameters remain in the equations in Standard mode. Switching modes changes visibility, not the model or values. Reference values are modelling assumptions; no temperature correction is applied.</p><div class="inputGrid"><label>Blood rheology<select data-property="rheology" id="design_rheology"><option value="carreau">Carreau–Yasuda</option><option value="newtonian">Constant viscosity</option></select></label><label>Haematocrit<span>fraction</span><input data-property="hematocrit" id="design_hematocrit" type="number" step="any"></label><label>Water / dialysate viscosity<span>Pa·s</span><input data-property="muWater" id="design_muWater" type="number" step="any"></label><label>Constant blood viscosity<span>Pa·s</span><input data-property="muBlood" id="design_muBlood" type="number" step="any"></label><label>Feed-water urea diffusivity<span>m²/s</span><input data-property="waterDiffusivity" id="design_waterDiffusivity" type="number" step="any"></label><label>Blood urea diffusivity parameter<span>m²/s</span><input data-property="bloodDiffusivity" id="design_bloodDiffusivity" type="number" step="any"></label><label>Dialysate urea diffusivity<span>m²/s</span><input data-property="dialysateDiffusivity" id="design_dialysateDiffusivity" type="number" step="any"></label><label>Plasma water fraction<input data-property="plasmaWater" id="design_plasmaWater" type="number" step="any"></label><label>RBC water fraction<input data-property="rbcWater" id="design_rbcWater" type="number" step="any"></label><label>Carreau zero-shear viscosity<span>Pa·s</span><input data-property="mu0" id="design_mu0" type="number" step="any"></label><label>Carreau high-shear viscosity<span>Pa·s</span><input data-property="muInf" id="design_muInf" type="number" step="any"></label><label>Carreau time constant<span>s</span><input data-property="carreauTime" id="design_carreauTime" type="number" step="any"></label><label>Carreau n<input data-property="carreauN" id="design_carreauN" type="number" step="any"></label><label>Carreau a<input data-property="carreauA" id="design_carreauA" type="number" step="any"></label><label>Axial numerical cells<span>20–400 · default 100; subdivisions along the fibre</span><input data-property="cells" id="design_cells" type="number" step="1"></label></div><button id="resetResearch" class="secondary">Reset advanced parameters only</button><h3 class="controlHeading">Water-measurement literature profiles</h3><label>Research profile<select id="waterProfile"></select></label><label>Area interpretation when the source is unresolved<select id="waterProfileBasis"><option value="">Select explicitly for unresolved profiles</option><option value="inner-area">Inner fibre exchange area</option><option value="planar">Planar membrane area</option></select></label><p class="hint">Profiles identify the measured product and conditions. Unresolved temperature, reference area or product-version mapping remains a scenario assumption; the shared polymer name does not establish equal permeability. Selecting a profile does not change geometry.</p><button id="applyWaterProfile" class="secondary">Apply selected water profile</button><h3 class="controlHeading">Model diagnostics</h3><dl class="facts"><div><dt>Overall equivalent K₀A</dt><dd id="koa">—</dd></div><div><dt>Equivalent Darcy permeability</dt><dd id="darcy">—</dd></div><div><dt>Material effective diffusivity</dt><dd id="deff">—</dd></div><div><dt>Equivalent fibres</dt><dd id="fiberCount">—</dd></div><div><dt>Effective membrane area</dt><dd id="effectiveArea">—</dd></div><div><dt>Equivalent dialysate outer radius</dt><dd id="dialysateRadius">—</dd></div><div><dt>Module internal diameter / packing</dt><dd id="moduleGeometry">—</dd></div><div><dt>Gross filtration / backfiltration</dt><dd id="grossUF">—</dd></div><div><dt>Net UF</dt><dd id="netUF">—</dd></div><div><dt>Feed / dialysate pressure drop</dt><dd id="pressureDrops">—</dd></div><div><dt>Numerical mass balance residual</dt><dd id="massBalance">—</dd></div><div><dt>Design conductance ratio</dt><dd id="designRatio">—</dd></div></dl></section></div></div></section><section id="data" class="tab" hidden><div class="sectionHeading"><p class="eyebrow">RESEARCH CHECKS</p><h2>Hematica reference reconstruction</h2><p>These are the original reference responses. Reproducing calibration nodes checks implementation; it does not establish independent predictive accuracy.</p></div><div class="panel"><h3 id="datasetName"></h3><div class="tableWrap"><table><thead><tr><th>Qd</th><th>Reference Kwater</th><th>Reconstructed Kwater</th><th>K₀A</th></tr></thead><tbody id="dataRows"></tbody></table></div><p id="lowCheck" class="hint"></p><h3>Internal leave-one-out check</h3><p id="cv" class="hint"></p><div class="tableWrap"><table><thead><tr><th>Excluded Qd</th><th>Reference K</th><th>Prediction</th><th>Difference</th></tr></thead><tbody id="cvRows"></tbody></table></div></div></section><section id="method" class="tab" hidden><div class="sectionHeading"><p class="eyebrow">MODEL &amp; METHOD</p><h2>Understand the prediction.</h2></div><div class="methodTabs" role="group" aria-label="Method topics"><button data-method="methodOverview" class="active" aria-pressed="true">Overview</button><button data-method="methodEquations" aria-pressed="false">Equations</button><button data-method="methodValidation" aria-pressed="false">Validation</button><button data-method="methodScope" aria-pressed="false">Scope &amp; assumptions</button></div><div id="methodOverview" class="methodPage panel prose"><h3>Purpose and operating scope</h3><p>Dialyzer Lab predicts steady urea clearance for pristine hollow-fibre membranes in CVVHD at zero net ultrafiltration. The model was calibrated using experimental data collected by Hematica during in-vitro CVVHD experiments. The reduced software model and its extrapolation have their own verification requirements.</p><h3>Standard and Research modes</h3><p>Standard mode exposes filter presets, Qb, Qd, area or fibre count, fibre length, inner diameter, membrane thickness and Lp, plus water/blood selection. Research mode exposes detailed membrane and module properties, fluid-side transfer, rheology and numerical settings. Both modes run the same equations. Unknown membrane parameters remain declared assumptions, not measured properties.</p><h3>Prediction and comparison remain separate</h3><p>Other-filter clearances are external comparison targets only. The software does not fit its parameters to the optional manufacturer clearance. Reference reconstruction and manufacturer cross-checks are shown separately in the Validation topic.</p></div><div id="methodEquations" class="methodPage panel prose" hidden><h3>Equivalent-exchanger transport metrics</h3><p>Qmin = min(Qw, Qd), Qmax = max(Qw, Qd), r = Qmin/Qmax, NTU = K₀A/Qmin, ε = Kwater/Qmin and E = Kwater/Qw. For r ≠ 1, ε = [1 − exp(−NTU(1 − r))] / [1 − r exp(−NTU(1 − r))]. At r = 1, ε = NTU/(1 + NTU). At Qd = 0, NTU and ε are undefined; removal and E are zero. These expressions characterise the final equivalent exchanger and are not additional local transport equations.</p><h3>Geometry and material transport</h3><div class="inlineEq">ro = ri + δ; ℓc = ri ln(ro/ri); Nf = A/(2πri L), or A = 2πri L Nf when fibre count is entered<br>rd = Rshell / √Nf; Rshell = ro √(Nf/φ) unless module internal diameter is entered<br>Deff,m = Dm εm h / τ<br>kDarcy = Lp μpore ℓc for Water Lp per inner area; kDarcy = Lp μpore δ for planar Lp</div><p>Membrane porosity εm and fibre packing φ are different properties. Lp must first be converted to SI units. The hydraulic input definition is explicit: water permeance per inner area uses the cylindrical length ℓc, while a planar Lp uses wall thickness δ. Blood-based device KUF is excluded from preset hydraulic inputs. With fixed Lp, pore viscosity cancels from the cylindrical hydraulic conductance; with intrinsic Darcy input it remains active.</p><h3>Coupled transport</h3><div class="inlineEq">Jv = kDarcy (pb − pd)/(μpore ℓc)<br>Rm = ℓc/Deff,m + Radd(Qd)<br>P = [1/kb + Rm + 1/kd]⁻¹<br>kfilm = Sh D/dh<br>Js = P[B(−Pe) Cb − B(Pe) Cd]<br>Pe = Jv/P; B(z) = z/[exp(z) − 1]</div><p>A conservative finite-volume solver couples hydraulics and solute transport in 100 axial cells by default. Net UF is constrained to zero while local filtration and backfiltration may occur. Film Sherwood numbers are constant closure parameters: 4.36 on the feed side and 3.66 on the dialysate side. They are editable in Research mode.</p><h3>Reference reduction and transfer</h3><div class="inlineEq">K₀A,ref = η Aref Dapp,ref / ℓc,ref<br>K₀A,design = K₀A,ref × K₀A,1D,design / K₀A,1D,ref</div><p>Dapp and η represent the calibrated reference reduction. Above Qd = 133.33 mL/min, unresolved resistance decays exponentially with matched endpoint value and slope; η remains at its terminal value. This is a declared continuation assumption.</p><h3>Countercurrent exchanger</h3><div class="inlineEq">Qmin = min(Qw,Qd); Cr = Qmin/Qmax; NTU = K₀A/Qmin<br>Kwater = Qmin [1 − exp(−NTU(1 − Cr))] / [1 − Cr exp(−NTU(1 − Cr))]<br>For Qw = Qd = Q: Kwater = Q K₀A/(Q + K₀A)</div><h3>Filtration fraction</h3><div class="inlineEq">Qgross = Σi max(Jv,i Ai, 0)<br>FF = Qgross / Qb,in; FF(%) = 100 × FF</div><p>This gross fraction includes internal forward filtration. It is distinct from net ultrafiltration, which remains zero. At Qd = 0 the hydraulic solver is bypassed and FF is not reported.</p><h3>Concentration reference</h3><div class="inlineEq">fw = (1 − Hct)fw,p + Hct fw,e; Qw = fw Qb<br>Cw,in = Cbulk,in/fw; ṁ = Kwater Cw,in<br>Cbulk,out = Cbulk,in (1 − Kwater/Qw)<br>Cd,out = Kwater Cw,in/Qd; Kbulk = Kwater/fw</div><p>Concentration scales removal and outlet concentrations, not clearance. At Qd = 0, clearance and removal are zero and effluent concentration is undefined.</p></div><div id="methodValidation" class="methodPage panel" hidden><p class="eyebrow">CURVES AND COMPARISON POINTS</p><h3>Predictions across filter configurations</h3><p class="hint">Only manufacturer urea-clearance observations explicitly reported at zero net UF are shown. The project treats these zero-net-UF observations as water tests; original test-medium descriptions remain in source details. Nonzero and unspecified UF are excluded. Commercial HD/CRRT labels do not restrict which physical presets can be explored in Clearance. A ±10% band does not determine eligibility or establish model validity.</p><div class="notice"><strong>Application: water · urea · CVVHD · net UF = 0.</strong><p>Eligible zero-net-UF observations use the water model under the project convention. This convention does not replace the original source description. Internal reference reconstruction remains in Research checks.</p></div><details class="validationExclusions"><summary>Excluded datasets and reasons</summary><div class="tableWrap"><table><thead><tr><th>Manufacturer / filter</th><th>Reason</th></tr></thead><tbody id="excludedValidationRows"></tbody></table></div></details><label>Aqueous zero-UF comparison dataset<select id="validationFilter"></select></label><label id="validationQdLabel" hidden><span id="validationFlowLabel">Manufacturer test dialysate flow</span><select id="validationQd"></select></label><p id="uncertaintyNote" class="hint"></p><div class="validationMeta"><span class="tag" id="validationBadge">MANUFACTURER CROSS-CHECK</span><p id="validationConditions"></p><p id="validationAssumptions" class="hint"></p><p id="validationProtocolSource" class="hint"></p></div><div class="chartTitle"><h3 id="validationChartHeading">Clearance versus feed flow</h3><span class="legend"><span id="validationCurveLegend">Predictions</span> <b>●</b><span id="validationPointLabel"> Manufacturer</span></span></div><div class="figureActions" role="group" aria-label="Download comparison figure"><button id="downloadValidationPng" class="secondary">Download figure · PNG</button><a id="downloadValidationSvg" class="secondary figureDownload" href="#" role="button">Download figure · SVG</a></div><div id="validationChart" class="chart"></div><div class="tableWrap"><table><thead><tr><th>Qb</th><th>Qd</th><th>Manufacturer K</th><th id="validationActiveHeader">Selected calibration</th><th id="validationAlternateHeader">Other calibration</th></tr></thead><tbody id="validationRows"></tbody></table></div><p id="validationSummary"></p><p class="hint">Catalog colours and the audit table follow the selected calibration at zero net UF. Phylther HF 17SD and the low-flow HF1000 points anchor the hybrid calibration. Agreement at these anchors is a calibration check. All deviations remain visible. Pediatric and small-area modules require particular care when geometry or transport properties are assumed.</p><div id="currentHydraulicAudit" class="tableWrap"><table><caption>Current preset comparison · selected calibration</caption><thead><tr><th>Brand</th><th>Selectable models</th><th>Matched water profiles available</th><th>UF=0 points</th><th>Calculated</th><th>Within ±10%</th><th>Outside ±10%</th><th>Not calculable</th></tr></thead><tbody id="hydraulicAuditRows"></tbody></table></div><p class="hint">The comparison uses each preset’s hydraulic input, including the shared assumed module conductance where applicable. Research water profiles may override the assumption for an individual run. A point without a prediction has no clearance error.</p><div id="externalValidationNotes"><p class="hint">The calculation uses water, so Kwater = Kbulk. Manufacturer concentration basis and test fluid must be checked before interpreting the difference as a validation error. Missing physical properties use model reference defaults. The continuation was selected after xevonta comparisons were already available; this is not a blind validation set.</p><p class="hint">Source: B. Braun xevonta / Renal Therapies Dialyzer technical brochures, urea clearance at Qd = 500 mL/min and QF = 0. <a href="https://www.bbraunusa.com/en/products/b4/xevonta-dialyzer.html" target="_blank" rel="noopener noreferrer">Manufacturer product and documents ↗</a></p></div><h3>Inside the reference conditions</h3><p class="hint">Calibration uses experimental data provided by Hematica from in-vitro CVVHD experiments at Qb = 100 mL/min and Qd ≤ 133.33 mL/min. Reference points are reconstructed by definition. Blood response points begin at Qd = 41.67 mL/min. Numerical implementation checks are not independent experimental validation.</p></div><div id="methodScope" class="methodPage panel prose" hidden><h3>Included</h3><p>Urea, pristine hollow-fibre membranes, steady countercurrent operation, zero net UF, water or an approximate blood-water transport description. Local convection and backfiltration are included in the 1D design model.</p><h3>Declared assumptions</h3><p>No adsorption, fouling, oncotic pressure or protein binding is modelled. Commercial presets without a source-specific default start from an assumed module hydraulic conductance of 35 mL/(h·mmHg), divided by the model inner area to obtain Lp. Measured water profiles remain available in Research mode. The historical calibration parameter is retained only for reference reconstruction and normalisation, not as a measured property of other membranes. Urea hindrance defaults to one as a modelling assumption. The water and blood properties retain the implemented reference values; the software does not apply a temperature correction. Haematocrit changes aqueous fraction and solute transport; it does not independently refit the Carreau parameters.</p><h3>How to interpret a comparison</h3><p>Match Qb, Qd, fluid, net UF, concentration basis and test conditions. Record assumed geometry and membrane properties. Agreement within one product family does not establish accuracy for all membranes. New comparisons should keep the reference calibration fixed.</p><h3>Access</h3><p>The entry password is checked in the browser. It controls normal interface navigation; it does not make the GitHub source or static assets private.</p></div></section><section class="contactSection" aria-labelledby="contacts-title"><div><p class="eyebrow">CONTACTS</p><h2 id="contacts-title">Let’s talk transport.</h2></div><div class="contactCards"><article><span class="footerLabel">MODEL DEVELOPMENT</span><h3>Antonio Pio Mantovan</h3><p>PhD researcher · Politecnico di Torino<br>DISAT · Department of Applied Science and Technology</p><p>Corso Duca degli Abruzzi 24<br>10129 Torino, Italy<br><small>Campus entrance: Corso Castelfidardo 39</small></p><a href="mailto:antonio.mantovan@polito.it">antonio.mantovan@polito.it ↗</a></article><article><span class="footerLabel">EXPERIMENTAL COLLABORATION</span><h3>Hematica</h3><a href="mailto:info@hematica.it">info@hematica.it ↗</a><a href="https://www.hematica.it/" target="_blank" rel="noopener noreferrer">hematica.it ↗</a><p>Corso Castelfidardo 30/A<br>10129 Turin, Italy</p></article></div></section><footer><div class="authorCredit"><span class="footerLabel">DIALYZER LAB</span><span>Developed by <strong>Antonio Pio Mantovan</strong></span><small>Research models · local browser processing</small></div><div cla
